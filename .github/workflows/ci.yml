name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR은 최신 push만 검증한다 — main push는 배포 대상 커밋의 검증 기록이 남아야 하므로 취소하지 않는다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 커밋된 스펙에서 재생성 → diff가 있으면 수동 편집이거나 생성 누락 (architecture.md §1)
      - run: pnpm api:generate
      - run: git diff --exit-code openapi src/shared/api/generated
      - run: pnpm typecheck
      # 루트 tsconfig 와일드카드는 dot 디렉터리를 건너뛴다 — .design-sync 의 프리뷰·하네스는
      # pnpm typecheck 가 보지 않아 컴포넌트 props 가 바뀌어도 프리뷰가 조용히 낡는다
      # (실제로 caseLabel 이 필수가 된 뒤 #55 까지 프리뷰가 안 따라갔다). 전용 프로젝트로 따로 본다.
      - run: pnpm typecheck:design-sync
      - run: pnpm test
      - run: pnpm build

  # 크리티컬 플로우 3종 (e2e/README.md). BE를 띄우지 않는다 — 브라우저에서 /api/v1/**를
  # 스텁하므로 BE 상태·네트워크와 무관하게 결정적이다. codegen-check와 별도 잡인 이유는
  # 병렬로 돌리기 위해서이자, 실패했을 때 "계약이 깨졌다"와 "화면 흐름이 깨졌다"를 구분하기 위해서다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 러너에 미리 깔린 브라우저는 버전이 어긋날 수 있다 — lockfile에 잠긴 버전을 직접 받는다
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts의 webServer가 프로덕션 빌드로 앱을 띄운다
      - run: pnpm test:e2e
      # 실패 원인은 trace 없이 좁히기 어렵다 (config: trace on-first-retry)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # automation/bin 게이트 스크립트 회귀 검증 — fail-closed 성질 + merge-gate.jq 판정 fixture
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: automation/bin/smoke-test.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks scan
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source=. --redact -v
