name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR은 최신 push만 검증한다 — main push는 배포 대상 커밋의 검증 기록이 남아야 하므로 취소하지 않는다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 커밋된 스펙에서 재생성 → diff가 있으면 수동 편집이거나 생성 누락 (architecture.md §1)
      - run: pnpm api:generate
      - run: git diff --exit-code openapi src/shared/api/generated
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # automation/bin 게이트 스크립트 회귀 검증 — fail-closed 성질 + merge-gate.jq 판정 fixture
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: automation/bin/smoke-test.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks scan
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source=. --redact -v
